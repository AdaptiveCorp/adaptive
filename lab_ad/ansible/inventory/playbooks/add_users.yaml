---
- name: Create Active Directory Users
  hosts: "{{ target_host }}"
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
    ansible_winrm_read_timeout_sec: 120

  tasks:
    - name: Create AD users
      win_domain_user:
        name: "{{ item.username }}"
        firstname: "{{ item.firstname | default(item.username) }}"
        surname: "{{ item.surname | default('User') }}"
        password: "{{ item.password }}"
        state: present
        enabled: yes
        password_never_expires: "{{ item.password_never_expires | default(false) }}"
        user_cannot_change_password: "{{ item.user_cannot_change_password | default(false) }}"
        description: "{{ item.description | default('Adaptive User') }}"
        path: "{{ item.ou_path | default('CN=Users,' + base_dn) }}"
        upn: "{{ item.username }}@{{ domain_fqdn }}"
      loop: "{{ users_list }}"
      register: user_creation

    - name: Display created users
      debug:
        msg: "User {{ item.username }} created successfully"
      loop: "{{ users_list }}"
