templates:
  # --- CONFIG templates (infrastructure) ---
  - code: dc_promo
    name: DC Promotion
    type: config
    description: Promotion d'un serveur Windows en contrôleur de domaine
    category: infrastructure
    required_params:
      - target_host
      - dsrm_password
      - domain_fqdn
      - domain_netbios
      - is_first_dc
    content: |
      ---
      - name: Promote Windows Server to Domain Controller
        hosts: "{{ target_host }}"
        gather_facts: no
        vars:
          ansible_connection: winrm
          ansible_winrm_transport: ntlm
          ansible_winrm_server_cert_validation: ignore
          ansible_port: 5985
          ansible_winrm_read_timeout_sec: 120
          ansible_winrm_operation_timeout_sec: 110

        tasks:
          - name: Install AD-Domain-Services role
            ansible.windows.win_feature:
              name: AD-Domain-Services
              include_management_tools: yes
              state: present
            register: ad_install

          - name: Create new forest (First DC)
            ansible.windows.win_shell: |
              $Password = ConvertTo-SecureString "{{ dsrm_password }}" -AsPlainText -Force
              Install-ADDSForest `
                -DomainName "{{ domain_fqdn }}" `
                -DomainNetbiosName "{{ domain_netbios }}" `
                -ForestMode "{{ forest_mode | default('WinThreshold') }}" `
                -DomainMode "{{ domain_mode | default('WinThreshold') }}" `
                -InstallDns:${{ install_dns | default(true) | string | lower }} `
                -SafeModeAdministratorPassword $Password `
                -Force `
                -NoRebootOnCompletion
            when: is_first_dc | bool
            register: forest_creation
            async: 600
            poll: 10

          - name: Join existing domain (Additional DC)
            ansible.windows.win_shell: |
              $Password = ConvertTo-SecureString "{{ dsrm_password }}" -AsPlainText -Force
              $DomainCred = New-Object System.Management.Automation.PSCredential("{{ domain_admin }}", $Password)

              Install-ADDSDomainController `
                -DomainName "{{ domain_fqdn }}" `
                -Credential $DomainCred `
                -SafeModeAdministratorPassword $Password `
                -InstallDns:${{ install_dns | default(true) | string | lower }} `
                -Force `
                -NoRebootOnCompletion
            when: not (is_first_dc | bool)
            register: dc_join
            async: 600
            poll: 10

          - name: Mark DC promotion complete
            set_fact:
              dc_promoted: true
            when: forest_creation.changed or dc_join.changed

          - name: Display pre-reboot message
            debug:
              msg: "DC promotion complete. Server will reboot. Credentials will change to {{ domain_fqdn }}\\Administrator"
            when: dc_promoted is defined

  - code: add_users
    name: Ajout d'utilisateurs AD
    type: config
    description: Création d'utilisateurs dans un domaine Active Directory
    category: infrastructure
    required_params:
      - target_host
      - users_list
      - base_dn
      - domain_fqdn
    content: |
      ---
      - name: Create Active Directory Users
        hosts: "{{ target_host }}"
        gather_facts: no
        vars:
          ansible_connection: winrm
          ansible_winrm_transport: ntlm
          ansible_winrm_server_cert_validation: ignore
          ansible_port: 5985
          ansible_winrm_read_timeout_sec: 120

        tasks:
          - name: Create AD users
            community.windows.win_domain_user:
              name: "{{ item.username }}"
              firstname: "{{ item.firstname | default(item.username) }}"
              surname: "{{ item.lastname | default('User') }}"
              password: "{{ item.password }}"
              state: present
              enabled: yes
              password_never_expires: "{{ item.password_never_expires | default(false) }}"
              user_cannot_change_password: "{{ item.user_cannot_change_password | default(false) }}"
              description: "{{ item.description | default('Created by Ansible') }}"
              path: "{{ item.ou_path | default('CN=Users,' + base_dn) }}"
              upn: "{{ item.username }}@{{ domain_fqdn }}"
            loop: "{{ users_list }}"
            register: user_creation

          - name: Display created users
            debug:
              msg: "User {{ item.username }} created successfully"
            loop: "{{ users_list }}"

  # --- VULNERABILITY templates ---
  - code: asrep_roasting
    name: AS-REP Roasting
    type: vulnerability
    description: Désactive la pré-authentification Kerberos pour permettre l'attaque AS-REP Roasting
    category: kerberos
    required_params:
      - username
    content: |
      Set-ADAccountControl -Identity "{{username}}" -DoesNotRequirePreAuth $true

  - code: kerberoasting
    name: Kerberoasting
    type: vulnerability
    description: Ajoute un SPN à un compte utilisateur pour le rendre Kerberoastable
    category: kerberos
    required_params:
      - username
      - spn_name
    content: |
      Set-ADUser -Identity "{{username}}" -ServicePrincipalNames @{Add='{{spn_name}}/{{username}}'}

  - code: genericall_dacl
    name: GenericAll DACL
    type: vulnerability
    description: Accorde les droits GenericAll à un utilisateur sur un autre
    category: acl
    required_params:
      - source_username
      - target_username
    content: |
    powershell_template: |
      $SourceUser = Get-ADUser -Identity "{{source_username}}"
      $TargetUser = Get-ADUser -Identity "{{target_username}}"
      $ACL = Get-ACL "AD:$($TargetUser.DistinguishedName)"
      $Identity = [System.Security.Principal.SecurityIdentifier]$SourceUser.SID
      $Rights = [System.DirectoryServices.ActiveDirectoryRights]::GenericAll
      $Type = [System.Security.AccessControl.AccessControlType]::Allow
      $ACE = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, $Type)
      $ACL.AddAccessRule($ACE)
      Set-ACL -Path "AD:$($TargetUser.DistinguishedName)" -AclObject $ACL

  - code: writedacl
    name: WriteDACL Permission
    type: vulnerability
    description: Permet à un utilisateur de modifier les ACL d'un autre objet
    category: acl
    required_params:
      - source_username
      - target_username
    content: |
      $SourceUser = Get-ADUser -Identity "{{source_username}}"
      $TargetUser = Get-ADUser -Identity "{{target_username}}"
      $ACL = Get-ACL "AD:$($TargetUser.DistinguishedName)"
      $Identity = [System.Security.Principal.SecurityIdentifier]$SourceUser.SID
      $Rights = [System.DirectoryServices.ActiveDirectoryRights]::WriteDacl
      $Type = [System.Security.AccessControl.AccessControlType]::Allow
      $ACE = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, $Type)
      $ACL.AddAccessRule($ACE)
      Set-ACL -Path "AD:$($TargetUser.DistinguishedName)" -AclObject $ACL

  - code: forcechangepassword
    name: Force Change Password
    type: vulnerability
    description: Donne le droit à un utilisateur de changer le mot de passe d'un autre
    category: acl
    required_params:
      - source_username
      - target_username
    content: |
      $SourceUser = Get-ADUser -Identity {{source_username}}
      $TargetUser = Get-ADUser -Identity {{target_username}}
      $ACL = Get-ACL "AD:$($TargetUser.DistinguishedName)"
      $Identity = [System.Security.Principal.SecurityIdentifier]$SourceUser.SID
      $Rights = [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight
      $GUID = [System.Guid]"00299570-246d-11d0-a768-00aa006e0529"
      $Type = [System.Security.AccessControl.AccessControlType]::Allow
      $ACE = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, $Type, $GUID)
      $ACL.AddAccessRule($ACE)
      Set-ACL -Path "AD:$($TargetUser.DistinguishedName)" -AclObject $ACL

  - code: dcsync
    name: DCSync Rights
    type: vulnerability
    description: Accorde les droits de réplication du domaine (DCSync attack)
    category: replication
    required_params:
      - username
      - domain_dn
    content: |
      $User = Get-ADUser -Identity "{{username}}"
      $Domain = "{{domain_dn}}"
      $ACL = Get-ACL "AD:$Domain"
      $Identity = [System.Security.Principal.SecurityIdentifier]$User.SID

      # DS-Replication-Get-Changes
      $GUID1 = [System.Guid]"1131f6aa-9c07-11d1-f79f-00c04fc2dcd2"
      $Rights = [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight
      $ACE1 = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, "Allow", $GUID1)

      # DS-Replication-Get-Changes-All
      $GUID2 = [System.Guid]"1131f6ad-9c07-11d1-f79f-00c04fc2dcd2"
      $ACE2 = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, "Allow", $GUID2)

      $ACL.AddAccessRule($ACE1)
      $ACL.AddAccessRule($ACE2)
      Set-ACL -Path "AD:$Domain" -AclObject $ACL
