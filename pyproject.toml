[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adaptive"]
exclude = ["adaptive/web"]

[project]
name = "adaptive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "ansible-runner>=2.4.2",
    "fastapi>=0.135.1",
    "gunicorn>=25.1.0",
    "proxmoxer>=2.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pywinrm>=0.5.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "yamllint>=1.38.0",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["adaptive"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # function-call-in-default-argument — required by FastAPI Depends()
]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]  # migrations are autogenerated, skip line length

[tool.ruff.lint.isort]
known-first-party = ["adaptive"]

[tool.pytest.ini_options]
testpaths = ["adaptive/tests"]
pythonpath = ["."]

