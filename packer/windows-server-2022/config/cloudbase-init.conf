[DEFAULT]
# Runs at every boot (cloudbase-init service)
username=Administrator
groups=Administrators
inject_user_password=true
first_logon_behaviour=no

# Drive detection for Proxmox cloud-init CD-ROM
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true

bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\

# Proxmox delivers cloud-init data as NoCloud format
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService

# SetHostNamePlugin and NetworkConfigPlugin are only in the unattend config
# (specialize pass, runs once). Keeping them here causes a reboot loop.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,
        cloudbaseinit.plugins.windows.createuser.CreateUserPlugin,
        cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin,
        cloudbaseinit.plugins.windows.winrmlistener.ConfigWinRMListenerPlugin,
        cloudbaseinit.plugins.windows.winrmcertificateauth.ConfigWinRMCertificateAuthPlugin,
        cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin

logging_serial_port_settings=COM1,115200,N,8
